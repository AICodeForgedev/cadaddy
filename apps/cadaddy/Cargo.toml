[package]
name = "cadaddy"
description = "CADaddy desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "cadaddy"

[lints]
workspace = true

[dependencies]
cadaddy-engine = { workspace = true }
cadaddy-ui-egui = { workspace = true }
cadaddy-io = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links", "persistence"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
# View ▸ Theme ▸ System: the desktop's light/dark choice from the XDG desktop portal
# (desktop_theme.rs). Already in Cargo.lock through accesskit; pinned to that version so nothing
# is built twice.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
sys-locale = "0.3"
# Checking downloaded updates (updater.rs); already built for DWG reading.
sha2 = "0.11"
# The release signature over SHA256SUMS (relsig.rs): pure Rust, BSD-3-Clause; verifying only.
ed25519-dalek = { version = "3.0.0", default-features = false }
# The control port's per-start token (control_server.rs). Already in Cargo.lock.
getrandom = "0.4"
# Paste to Command Line reads the system clipboard's text. Already in Cargo.lock through
# egui-winit; pinned to that version so nothing is built twice.
arboard = { version = "=3.6.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
# View ▸ Accessibility ▸ Animation Effects ▸ Use System Setting: the system's Reduce motion
# (system_animations.rs). Already in Cargo.lock through muda.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }

# Rust HID backends: no proprietary SDK or C HID library.
[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
# View ▸ Accessibility ▸ Animation Effects ▸ Use System Setting: Windows' Animation effects
# setting (system_animations.rs). Already in Cargo.lock through wgpu's DirectX 12 backend.
windows = { version = "0.62", features = ["UI_ViewManagement"] }
# Copies go on the clipboard as CADaddy objects and as a picture together (sysclip.rs): safe
# clipboard formats API. Already in Cargo.lock through arboard; pinned to that version.
clipboard-win = "=5.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

[[bin]]
name = "cadaddy"
path = "src/main.rs"
