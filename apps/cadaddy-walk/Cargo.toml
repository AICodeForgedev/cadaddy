[package]
name = "cadcraft-walk"
description = "Headless walk-mode renderer: one frame of a drawing's derived 3D to a PNG (walk mode itself is in CADaddy, View ▸ Walk)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
publish = false

[lints]
workspace = true

[[bin]]
name = "cadaddy-walk"
path = "src/main.rs"

[dependencies]
cadcraft-ui-egui = { workspace = true }
cadcraft-engine = { workspace = true }
cadcraft-io = { workspace = true }
cadcraft-walk3d = { path = "../../crates/walk3d" }
egui-wgpu = { workspace = true }
image = { workspace = true }
pollster = "0.4"
