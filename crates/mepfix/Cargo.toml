[package]
name = "cadaddy-mepfix"
description = "CADaddy MEP print fixtures: made-up mechanical, plumbing, fire protection, ceiling and structural sheets (vector PDF + DXF) with a JSON ground truth to score print readers against"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
publish = false

[lints]
workspace = true

[[bin]]
name = "mep-fixtures"
path = "src/bin/mep-fixtures.rs"

[dependencies]
cadaddy-geom = { workspace = true }
cadaddy-color = { workspace = true }
cadaddy-doc = { workspace = true }
cadaddy-io = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Scanned prints (Q272): printing sheets to images, JPEG artefacts, OCR glyph templates.
cadaddy-render = { workspace = true }
cadaddy-fonts = { workspace = true }
image = { workspace = true }
# The RFI list's items (shared with the building spec) and the print validator's inputs.
cadaddy-walk3d = { path = "../walk3d" }
# Read trays become 3D runs, clash with other trades and export to IFC (tray_reader test).
# The agent tools are tried on a whole synthetic hotel (agentready test).
cadaddy-engine = { workspace = true }

[dev-dependencies]
cadaddy-dxf = { workspace = true }
# Read sprinklers become a 3D model and IFC (sprinkler_reader's end-to-end test).
cadaddy-engine = { workspace = true }
