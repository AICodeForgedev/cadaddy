[package]
name = "cadaddy-mepfix"
description = "CADaddy print readers and the print-set pipeline, plus MEP print fixtures: made-up mechanical, plumbing, fire protection, ceiling and structural sheets (vector PDF + DXF) with a JSON ground truth to score print readers against"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
publish = false

[lints]
workspace = true

[[bin]]
name = "mep-fixtures"
path = "src/bin/mep-fixtures.rs"

[dependencies]
cadaddy-geom = { workspace = true }
cadaddy-color = { workspace = true }
cadaddy-doc = { workspace = true }
cadaddy-io = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Scanned prints (Q272): printing sheets to images, JPEG artefacts, OCR glyph templates.
cadaddy-render = { workspace = true }
cadaddy-fonts = { workspace = true }
image = { workspace = true }
# The RFI list's items (shared with the building spec) and the print validator's inputs.
cadaddy-walk3d = { path = "../walk3d" }
# Stage timings: std::time::Instant panics in the web build.
web-time = "1.1"
[dev-dependencies]
cadaddy-dxf = { workspace = true }
# Tests that need the engine or the MCP server live in crates/engine/tests and crates/mcp (10-23: mepfix is
# the readers layer under the engine, so it may not depend on it, not even for tests).
