[package]
name = "cadaddy-render"
description = "CADaddy rendering: display lists (linetypes, hatches, text, blocks, dimensions) and a CPU rasteriser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# A clock that works in the browser too (std::time::Instant panics on wasm32).
web-time = "1.1"
# Deflate for binary plot style tables (.ctb/.stb); MIT OR Zlib OR Apache-2.0, already used by cadaddy-io.
miniz_oxide = "0.8"
cadaddy-geom = { workspace = true }
cadaddy-color = { workspace = true }
cadaddy-doc = { workspace = true }
cadaddy-fonts = { workspace = true }
tiny-skia = { workspace = true }
# Raster images (IMAGE entities): PNG and JPEG decoding (MIT/Apache-2.0).
image = { workspace = true }
lyon_tessellation = { workspace = true }

# Display lists of large drawings are built on all cores (not on the web, which has no threads).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
