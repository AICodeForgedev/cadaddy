[package]
name = "cadaddy-mcp"
description = "CADaddy MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadaddy-engine = { workspace = true }
cadaddy-render = { workspace = true }
cadaddy-io = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# The real file formats for the MCP suite (tests/suite.rs), installed as the app does.
cadaddy-io = { workspace = true }
# The synthetic hotel the weak agent works on (tests/weakagent.rs).
cadaddy-mepfix = { path = "../mepfix" }
# bimbench (moved from cadaddy-mepfix 10-23) builds the hotel model and reads its 3D parts.
cadaddy-walk3d = { path = "../walk3d" }

# bimbench times the agent tools through the MCP server on the built hotel; its stage checks are
# unit-tested (`cargo test -p cadaddy-mcp --example bimbench`). `cargo xtask perf` runs it.
[[example]]
name = "bimbench"
test = true
