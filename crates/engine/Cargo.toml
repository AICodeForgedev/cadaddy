[package]
name = "cadaddy-engine"
description = "CADaddy engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# A clock that works in the browser too (std::time::Instant panics on wasm32).
web-time = "1.1"
cadaddy-walk3d = { path = "../walk3d" }
cadaddy-geom = { workspace = true }
cadaddy-color = { workspace = true }
cadaddy-doc = { workspace = true }
cadaddy-dxf = { workspace = true }
cadaddy-cam = { workspace = true }
cadaddy-constraints = { workspace = true }
cadaddy-fonts = { workspace = true }
cadaddy-render = { workspace = true }
craft-docpath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }
# Deflate for ETRANSMIT's ZIP archives (MIT OR Zlib OR Apache-2.0; already used by cadaddy-io).
miniz_oxide = "0.8"
# SHA-256 of AR export files for the field app's update manifest (MIT OR Apache-2.0; already used by the app and xtask).
sha2 = "0.11"
# Human-readable project rules files (MIT OR Apache-2.0; already used by cadaddy-ui-egui).
toml = "1"
# Embedded scripting language (MIT OR Apache-2.0). Sandboxed: Engine::new_raw() + selective packages.
rhai = { version = "1.27", default-features = false, features = ["std", "serde", "sync"] }
# Bridge for Rhai closures to call back into Session (see rhai-bridge crate).
cadaddy-rhai-bridge = { path = "../rhai-bridge" }
# MEP print fixtures and print-set pipeline (printset, reader wiring).
cadaddy-mepfix = { path = "../mepfix" }

# The local time-zone offset on Windows (no /etc/localtime there): FIELD dates and the Drawing
# Recovery times were UTC. MIT OR Apache-2.0; only its clock.
[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The job's peak memory per stage (getrusage's maximum resident size, without unsafe code; MIT;
# already in the workspace's lock file).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["resource"] }

[dev-dependencies]
# Counts the bytes the test binary holds (undo and close memory tests).
cadaddy-memcount = { workspace = true }
# Real DXF files for the external reference tests (io is a lower layer).
cadaddy-io = { workspace = true }
# WAT-to-WASM for the plug-in fuel-exhaustion test (MIT OR Apache-2.0).
wat = "1"
# Made-up print sets and their revisions (Q270 print comparison tests).
cadaddy-mepfix = { path = "../mepfix" }
# JPEG artefacts for the IMAGETRACE accuracy tests, and reading back the PNG, JPEG, BMP and TIFF files
# PNGOUT… and the raster plot devices write (already the renderer's image codec).
image = { workspace = true, features = ["bmp", "tiff"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Edits of very large selections chunk by chunk on all cores (already used by render and io).
rayon = { workspace = true }
# Sandboxed WASM plug-in runtime: a pure-Rust interpreter with fuel metering (MIT OR Apache-2.0).
wasmi = "0.41"

# The test programs under tests/suite/: each folds many test files into one binary (one link
# of the crate instead of one per file). A test file that needs a process of its own stays a
# top-level file in tests/ (see CLAUDE.md, "Where a test goes").
[[test]]
name = "suite_annotate"
path = "tests/suite/annotate/main.rs"

[[test]]
name = "suite_draw"
path = "tests/suite/draw/main.rs"

[[test]]
name = "suite_estimate"
path = "tests/suite/estimate/main.rs"

[[test]]
name = "suite_files"
path = "tests/suite/files/main.rs"

[[test]]
name = "suite_files_pdf"
path = "tests/suite/files_pdf/main.rs"

[[test]]
name = "suite_files_plot"
path = "tests/suite/files_plot/main.rs"

[[test]]
name = "suite_files_plotpdf"
path = "tests/suite/files_plotpdf/main.rs"

[[test]]
name = "suite_files_saveas"
path = "tests/suite/files_saveas/main.rs"

[[test]]
name = "suite_jobs"
path = "tests/suite/jobs/main.rs"

[[test]]
name = "suite_model3d"
path = "tests/suite/model3d/main.rs"

[[test]]
name = "suite_script"
path = "tests/suite/script/main.rs"

[[test]]
name = "suite_validate"
path = "tests/suite/validate/main.rs"
