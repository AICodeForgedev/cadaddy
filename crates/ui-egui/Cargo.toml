[package]
name = "cadaddy-ui-egui"
description = "CADaddy user interface (egui): the swappable front end"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
# std::time::Instant panics in the browser (wasm32-unknown-unknown has no clock); this is the
# same Instant on native and the page's clock on the web (MIT OR Apache-2.0; egui uses it too).
web-time = "1.1"
craft-ui = { workspace = true }
cadaddy-geom = { workspace = true }
cadaddy-color = { workspace = true }
cadaddy-doc = { workspace = true }
cadaddy-render = { workspace = true }
cadaddy-engine = { workspace = true }
cadaddy-fonts = { workspace = true }
cadaddy-walk3d = { path = "../walk3d" }
# Checksums of uploaded GPU pieces, so unchanged ones are reused (MIT OR Apache-2.0; already used by .cdy).
crc32fast = "1"
egui = { workspace = true }
# GPU canvas paint callback (same egui-wgpu/wgpu eframe uses with its "wgpu" feature).
egui-wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# The real file formats for the end-to-end tests (tests/e2e_*.rs), installed as the app does.
# The million-object test opens and saves real DXF and .cdy files.
cadaddy-io = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Validates the canvas WGSL and its GLSL ES 3.0 (WebGL2) translation in tests (same naga wgpu uses).
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
