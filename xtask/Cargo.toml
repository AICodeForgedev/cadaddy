[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true }
# `cargo xtask release-key` / `sign-release` (apps/cadaddy/src/relsig.rs): pure Rust, BSD-3-Clause.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
sha2 = "0.11"
# The release key's random seed (already in Cargo.lock).
getrandom = "0.4"
